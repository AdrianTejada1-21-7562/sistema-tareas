name: Avisos de vencimientos

on:
  schedule:
    # Hora de República Dominicana (UTC-4). GitHub puede retrasarlas unos minutos.
    - cron: '7 12 * * *' # 8:07 a. m.
    - cron: '7 17 * * *' # 1:07 p. m.
    - cron: '7 22 * * *' # 6:07 p. m.
    - cron: '17 0 * * *' # 8:17 p. m., antes de empezar las tareas
    - cron: '17 2 * * *' # 10:17 p. m., mientras se hacen
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/avisos/enviar.mjs
        env:
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
      # GitHub apaga las tareas programadas tras 60 días sin actividad en el repositorio.
      - name: Mantener activo el aviso diario
        if: always()
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
